server {
    listen 80;
    server_name borrowed.miniserver.fun;

    include /www/server/panel/vhost/nginx/well-known/borrowed.miniserver.fun.conf;

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/borrowed.miniserver.fun.log;
    error_log /www/wwwlogs/borrowed.miniserver.fun.error.log;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;

    server_name borrowed.miniserver.fun;
    root /www/wwwroot/borrowed.miniserver.fun/deploy/current;
    index index.html;
    charset utf-8;

    include /www/server/panel/vhost/nginx/extension/borrowed.miniserver.fun/*.conf;
    include /www/server/panel/vhost/nginx/well-known/borrowed.miniserver.fun.conf;

    ssl_certificate /www/server/panel/vhost/cert/borrowed.miniserver.fun/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/borrowed.miniserver.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_early_data off;

    quic_retry on;
    quic_gso on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header_inherit merge;

    error_page 497 https://$host$request_uri;

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /release.json {
        try_files /release.json =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /ngsw.json {
        try_files /ngsw.json =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /ngsw-worker.js {
        try_files /ngsw-worker.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /safety-worker.js {
        try_files /safety-worker.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /worker-basic.min.js {
        try_files /worker-basic.min.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* ^/.+-[a-z0-9]{8,}\.(?:css|js)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location ~ ^/(?:\.env|\.git|\.htaccess|\.project|\.svn|\.user\.ini)(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/borrowed.miniserver.fun.log;
    error_log /www/wwwlogs/borrowed.miniserver.fun.error.log;
}
