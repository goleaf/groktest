name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm test:deployment
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Package the production web release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: deploy/package-web-release.sh "${{ github.sha }}" dist/borrowed/browser release
      - name: Upload the production web release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: borrowed-web-${{ github.sha }}
          path: |
            release/borrowed-web-${{ github.sha }}.tar.gz
            release/borrowed-web-${{ github.sha }}.tar.gz.sha256
            deploy/activate-web-release.sh
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
